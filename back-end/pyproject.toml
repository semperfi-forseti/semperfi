[project]
name = "semperfi-backend"
version = "0.1.0"
description = "Backend multi-tenant jurídico e investigativo do SEMPER-FI"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "celery>=5.4,<6.0",
  "redis>=5.0,<6.0",
  "httpx>=0.27,<1.0",
  "tenacity>=9.0,<10.0",
  "boto3>=1.35,<2.0",
  "python-multipart>=0.0.9",
  "cryptography>=43.0",
  "python-jose[cryptography]>=3.3",
  "structlog>=24.4",
  "prometheus-fastapi-instrumentator>=7.0",
  "sentry-sdk>=2.0",
  "email-validator>=2.2",
  "reportlab>=4.2",
  "psycopg2-binary>=2.9.13",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E701", "E702", "B008", "B904", "UP047"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
