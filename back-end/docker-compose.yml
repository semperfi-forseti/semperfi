services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: semperfi
      POSTGRES_USER: semperfi
      POSTGRES_PASSWORD: semperfi
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/init-db.sql:/docker-entrypoint-initdb.d/10-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semperfi -d semperfi"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio_data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: /bin/sh
    command: >-
      -c "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb --ignore-existing --with-lock local/semperfi-evidence"

  clamav:
    image: clamav/clamav:stable
    ports: ["3310:3310"]

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://semperfi:semperfi@postgres:5432/semperfi
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      S3_ENDPOINT_URL: http://minio:9000
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./:/app
    ports: ["8000:8000"]
    depends_on:
      - postgres
      - redis
      - minio-init

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://semperfi:semperfi@postgres:5432/semperfi
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      S3_ENDPOINT_URL: http://minio:9000
    command: celery -A app.workers:celery_app worker -l INFO -Q critical,default,cpu_heavy,agents
    volumes:
      - ./:/app
    depends_on:
      - postgres
      - redis
      - minio-init

  beat:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://semperfi:semperfi@postgres:5432/semperfi
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    command: celery -A app.workers:celery_app beat -l INFO
    volumes:
      - ./:/app
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  minio_data: